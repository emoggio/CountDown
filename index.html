<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Countdown to Us</title>

  <!--
  ============================================================
  EDIT THESE 4 LINES ONLY — everything else can stay as-is.
  Find the CONFIG block a little further down in this file.
  ============================================================
-->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --ink: #1a1410;
      --paper: #faf6ef;
      --paper-dim: rgba(250, 246, 239, 0.72);
      --chili: #c1440e;
      --gold: #d4a24c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--ink);
    }

    body {
      font-family: 'Fraunces', Georgia, serif;
      color: var(--paper);
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ---------- Background photo ---------- */
    #bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 22%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.15) 46%, rgba(0, 0, 0, 0.05) 65%),
        url('your-photo.jpg');
      /* <-- EDIT: path/URL to your photo (also set in CONFIG below) */
      background-size: cover;
      background-position: center;
      /* fallback look if the photo file is missing */
      background-color: #3a231c;
      animation: kenburns 26s ease-in-out infinite alternate;
    }

    @keyframes kenburns {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.07);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      #bg {
        animation: none;
      }
    }

    /* ---------- Layout ---------- */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding:
        max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      padding-bottom: 12px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--paper-dim);
      font-weight: 600;
    }

    .nickname {
      font-style: italic;
      font-weight: 500;
      color: var(--chili);
      font-size: clamp(22px, 6vw, 30px);
      margin-bottom: 4px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
    }

    .count-number {
      font-weight: 900;
      font-size: clamp(88px, 32vw, 168px);
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
    }

    .count-label {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--paper-dim);
      margin-top: 2px;
      margin-bottom: 18px;
    }

    .together-message {
      font-style: italic;
      font-weight: 600;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.15;
      margin: 8px 0 22px;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
    }

    .divider {
      width: 44px;
      height: 1px;
      background: rgba(250, 246, 239, 0.35);
      margin-bottom: 18px;
    }

    .ticker {
      display: flex;
      gap: 22px;
    }

    .ticker-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .ticker-value {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-weight: 600;
      font-size: clamp(18px, 5.4vw, 24px);
      font-variant-numeric: tabular-nums;
    }

    .ticker-tag {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--paper-dim);
    }

    /* ---------- Vinyl mute toggle ---------- */
    .audio-toggle {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(250, 246, 239, 0.15);
      background: rgba(20, 14, 10, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .audio-toggle:hover {
      transform: scale(1.06);
      border-color: rgba(212, 162, 76, 0.45);
    }

    .audio-toggle:active {
      transform: scale(0.95);
    }

    .audio-toggle svg {
      width: 32px;
      height: 32px;
      animation: spin 3s linear infinite;
      animation-play-state: paused;
      opacity: 0.5;
      transition: opacity 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .audio-toggle.playing {
      border-color: rgba(212, 162, 76, 0.35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 12px rgba(212, 162, 76, 0.25);
    }

    .audio-toggle.playing svg {
      animation-play-state: running;
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(212, 162, 76, 0.35));
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .audio-toggle svg {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="bg"></div>

  <button class="audio-toggle" id="audioToggle" aria-label="Play music" aria-pressed="false">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Vinyl light sheen reflection 1 -->
        <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <!-- Vinyl light sheen reflection 2 -->
        <linearGradient id="sheen2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <!-- Label Gradient -->
        <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e5b358" />
          <stop offset="100%" stop-color="#ba822f" />
        </linearGradient>
      </defs>

      <!-- Vinyl Outer Body -->
      <circle cx="24" cy="24" r="23" fill="#120e0c" stroke="rgba(250,246,239,0.2)" stroke-width="0.75" />

      <!-- Grooves -->
      <circle cx="24" cy="24" r="20.5" stroke="rgba(250,246,239,0.12)" stroke-width="0.6" />
      <circle cx="24" cy="24" r="18" stroke="rgba(250,246,239,0.16)" stroke-width="0.6" stroke-dasharray="14 3 8 2" />
      <circle cx="24" cy="24" r="15.5" stroke="rgba(250,246,239,0.12)" stroke-width="0.6" />
      <circle cx="24" cy="24" r="13" stroke="rgba(250,246,239,0.18)" stroke-width="0.6" stroke-dasharray="10 4 18 3" />
      <circle cx="24" cy="24" r="10.5" stroke="rgba(250,246,239,0.14)" stroke-width="0.6" />

      <!-- Opposing Specular Light Reflection Cones (Sheen that rotates with the vinyl) -->
      <path d="M 24 24 L 9 3 A 23 23 0 0 1 21 1 Z" fill="url(#sheen1)" />
      <path d="M 24 24 L 39 45 A 23 23 0 0 1 27 47 Z" fill="url(#sheen1)" />
      <path d="M 24 24 L 45 9 A 23 23 0 0 1 47 21 Z" fill="url(#sheen2)" />
      <path d="M 24 24 L 3 39 A 23 23 0 0 1 1 27 Z" fill="url(#sheen2)" />

      <!-- Run-out Groove Spiral -->
      <path d="M 24 10.5 C 28 10.5 31.5 13.5 31.5 17.5 C 31.5 22 27.5 25.5 23 25.5 C 19 25.5 16 22.5 16.5 19 C 17 16 19.5 14 22 14" fill="none" stroke="rgba(250,246,239,0.22)" stroke-width="0.5" />

      <!-- Center Label -->
      <circle cx="24" cy="24" r="8" fill="url(#labelGrad)" stroke="#8e5d16" stroke-width="0.5" />
      <!-- Label Two-Tone Contrast Arc -->
      <path d="M 16 24 A 8 8 0 0 1 32 24 Z" fill="#c4933a" opacity="0.9" />
      <circle cx="24" cy="24" r="7" stroke="rgba(18,14,12,0.25)" stroke-width="0.5" stroke-dasharray="1.5 1.5" />

      <!-- Distinctive Vintage Label Markings (Rotates clearly) -->
      <circle cx="24" cy="19.5" r="1.1" fill="#14100c" />
      <rect x="20.5" y="21.8" width="7" height="1" rx="0.5" fill="#14100c" />
      <rect x="22" y="26.2" width="4" height="0.8" rx="0.4" fill="#14100c" />

      <!-- Strobe / Calibration Tick Marks on Left and Right of Label -->
      <line x1="17.5" y1="24" x2="19" y2="24" stroke="#14100c" stroke-width="0.8" stroke-linecap="round" />
      <line x1="29" y1="24" x2="30.5" y2="24" stroke="#14100c" stroke-width="0.8" stroke-linecap="round" />

      <!-- Center Spindle Hole -->
      <circle cx="24" cy="24" r="2.2" fill="#14100c" stroke="rgba(250,246,239,0.7)" stroke-width="0.5" />
    </svg>
  </button>

  <audio id="audioPlayer" autoplay loop playsinline>
    <source src="song.mp3" type="audio/mpeg"> <!-- EDIT: path/URL to your song (also set in CONFIG below) -->
  </audio>

  <div class="stage">
    <div class="content">
      <div class="eyebrow">Days until I will see my</div>
      <div class="nickname" id="nicknameEl">Spicy Kofte</div>

      <div id="countdownArea">
        <div class="count-number" id="daysNumber">--</div>
        <div class="count-label">days</div>
        <div class="divider"></div>
        <div class="ticker">
          <div class="ticker-unit">
            <div class="ticker-value" id="hoursVal">00</div>
            <div class="ticker-tag">Hrs</div>
          </div>
          <div class="ticker-unit">
            <div class="ticker-value" id="minsVal">00</div>
            <div class="ticker-tag">Min</div>
          </div>
          <div class="ticker-unit">
            <div class="ticker-value" id="secsVal">00</div>
            <div class="ticker-tag">Sec</div>
          </div>
        </div>
      </div>

      <div class="together-message" id="togetherMessage" style="display:none;"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG — edit these 4 values whenever you plan a new visit.
       ============================================================ */
    const CONFIG = {
      TARGET_DATE: '2026-08-22T19:00:00',   // EDIT: next meet-up date & time (YYYY-MM-DDTHH:MM:SS), your local time
      BACKGROUND_IMAGE: 'photo.jpg',        // EDIT: filename or URL of your photo
      MUSIC_SRC: 'song.mp3',                // EDIT: filename or URL of your song
      NICKNAME: 'Spicy Kofte'               // EDIT: her nickname
    };
    /* ============================================================ */

    // Apply CONFIG
    document.getElementById('bg').style.backgroundImage =
      `linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 22%),
     linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 46%, rgba(0,0,0,0.05) 65%),
     url('${CONFIG.BACKGROUND_IMAGE}')`;
    const audioMimeTypes = { mp3: 'audio/mpeg', mp4: 'video/mp4', m4a: 'audio/mp4', wav: 'audio/wav', ogg: 'audio/ogg' };
    const audioExt = CONFIG.MUSIC_SRC.split('.').pop().toLowerCase();
    const audioSourceEl = document.querySelector('#audioPlayer source');
    audioSourceEl.src = CONFIG.MUSIC_SRC;
    audioSourceEl.type = audioMimeTypes[audioExt] || '';
    document.getElementById('audioPlayer').load();
    document.getElementById('nicknameEl').textContent = CONFIG.NICKNAME;

    // Countdown
    const daysNumber = document.getElementById('daysNumber');
    const hoursVal = document.getElementById('hoursVal');
    const minsVal = document.getElementById('minsVal');
    const secsVal = document.getElementById('secsVal');
    const countdownArea = document.getElementById('countdownArea');
    const togetherMessage = document.getElementById('togetherMessage');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const target = new Date(CONFIG.TARGET_DATE).getTime();
      const now = Date.now();
      const diff = target - now;

      if (diff <= 0) {
        countdownArea.style.display = 'none';
        togetherMessage.style.display = 'block';
        togetherMessage.textContent = `With my ${CONFIG.NICKNAME} today`;
        return;
      }

      countdownArea.style.display = '';
      togetherMessage.style.display = 'none';

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);

      daysNumber.textContent = days;
      hoursVal.textContent = pad(hours);
      minsVal.textContent = pad(mins);
      secsVal.textContent = pad(secs);
    }

    tick();
    setInterval(tick, 1000);

    // Vinyl play/pause toggle — default: ON (autoplay enabled)
    const audio = document.getElementById('audioPlayer');
    const toggleBtn = document.getElementById('audioToggle');

    function updatePlayState() {
      if (!audio.paused) {
        toggleBtn.classList.add('playing');
        toggleBtn.setAttribute('aria-pressed', 'true');
        toggleBtn.setAttribute('aria-label', 'Pause music');
      } else {
        toggleBtn.classList.remove('playing');
        toggleBtn.setAttribute('aria-pressed', 'false');
        toggleBtn.setAttribute('aria-label', 'Play music');
      }
    }

    audio.addEventListener('play', updatePlayState);
    audio.addEventListener('pause', updatePlayState);
    audio.addEventListener('playing', updatePlayState);

    // Autoplay attempt on load
    function tryAutoplay() {
      audio.muted = false;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updatePlayState();
        }).catch(() => {
          // If browser policy blocks unprompted autoplay, start seamlessly on first user interaction anywhere
          const unlockAudio = () => {
            audio.play().then(() => {
              updatePlayState();
            }).catch(() => { });
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
          };
          window.addEventListener('pointerdown', unlockAudio, { once: true });
          window.addEventListener('touchstart', unlockAudio, { once: true });
          window.addEventListener('click', unlockAudio, { once: true });
          window.addEventListener('keydown', unlockAudio, { once: true });
        });
      }
    }

    tryAutoplay();
    document.addEventListener('DOMContentLoaded', tryAutoplay);

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().catch(() => { });
      } else {
        audio.pause();
      }
    });
  </script>

</body>

</html>
